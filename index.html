<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر التطبيقات</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --text: #1f2937;
      --muted: #5f6368;
      --accent: #0b57d0;
      --accent-soft: #e8f0fe;
      --border: #e5e7eb;
      --star: #f59e0b;
      --danger: #dc2626;
      --success: #15803d;
      --radius-icon: 22px;
      --radius-card: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Naskh Arabic", "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0b57d0, #1a73e8);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 17px;
    }

    .search-box {
      flex: 1;
      min-width: 190px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: var(--surface);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #0842a0;
    }

    .btn-soft {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    .btn-danger-soft {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--danger);
    }

    /* Main Container */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 56px;
    }

    .shelf {
      margin-bottom: 32px;
    }

    .shelf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .shelf-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    /* Google Play Style Clean Shelf & Grid */
    .shelf-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(112px, 1fr);
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }

    @media (min-width: 640px) {
      .shelf-row {
        grid-auto-columns: minmax(132px, 1fr);
        gap: 20px;
      }
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px 14px;
    }

    @media (min-width: 640px) {
      .apps-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px 20px;
      }
    }

    @media (min-width: 900px) {
      .apps-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    /* Minimal Card: Icon + Name + Rating ONLY */
    .play-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      user-select: none;
      border-radius: var(--radius-card);
      transition: transform 0.14s ease;
    }

    .play-card:hover .play-icon {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    .play-icon {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-icon);
      object-fit: cover;
      background: var(--surface);
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .play-icon-fallback {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-icon);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .play-name {
      margin-top: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-rating {
      margin-top: 2px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .star {
      color: var(--star);
    }

    /* Full Details View */
    .details-view {
      display: none;
    }

    .details-view.active {
      display: block;
    }

    .back-bar {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .details-hero {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .details-icon-wrap {
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .details-icon-wrap img,
    .details-icon-wrap .play-icon-fallback {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      font-size: 36px;
    }

    .details-meta h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .details-sub {
      color: var(--muted);
      font-size: 14px;
    }

    .details-stats {
      display: flex;
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    .details-actions {
      display: flex;
      gap: 10px;
      margin: 18px 0 24px;
      flex-wrap: wrap;
    }

    .section-block {
      margin-top: 24px;
    }

    .section-block h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    .screenshots-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .screenshots-row img {
      height: 210px;
      border-radius: 14px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    .review-card {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      background: var(--surface);
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .review-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
      margin-top: 12px;
    }

    .review-form select,
    .review-form textarea,
    .review-form input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 14px;
    }

    /* App Runner Modal / Overlay */
    .runner-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .runner-overlay.open {
      display: flex;
    }

    .runner-window {
      width: 100%;
      max-width: 980px;
      height: 82vh;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .runner-bar {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .runner-title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .runner-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }

    /* Library Drawer / Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      max-height: 84vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 17px;
    }

    .lib-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .lib-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .lib-item-left img,
    .lib-item-left .play-icon-fallback {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      font-size: 18px;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand" id="homeBrand">
        <div class="brand-logo">▶</div>
        <div class="brand-title" id="storeTitle">متجر التطبيقات</div>
      </div>

      <div class="search-box">
        <input type="search" id="searchInput" placeholder="ابحث عن تطبيق..." autocomplete="off" />
      </div>

      <div class="nav-actions">
        <button class="btn btn-soft" id="openLibraryBtn">
          <span>مكتبتي</span>
          <span id="libraryCountBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Home Catalog View -->
    <div id="catalogView">
      <section class="shelf" id="recommendedShelf">
        <div class="shelf-header">
          <h2 class="shelf-title">مقترحة لك</h2>
        </div>
        <div class="shelf-row" id="recommendedRow"></div>
      </section>

      <section class="shelf">
        <div class="shelf-header">
          <h2 class="shelf-title" id="allAppsTitle">جميع التطبيقات</h2>
        </div>
        <div class="apps-grid" id="allAppsGrid"></div>
      </section>
    </div>

    <!-- Full App Details View -->
    <section class="details-view" id="detailsView">
      <div class="back-bar">
        <button class="btn" id="backToStoreBtn">← العودة للمتجر</button>
      </div>
      <div id="detailsContent"></div>
    </section>
  </main>

  <!-- Library Modal -->
  <div class="modal-backdrop" id="libraryModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>مكتبتي</h3>
        <button class="btn" id="closeLibraryBtn">إغلاق</button>
      </div>
      <div id="libraryList"></div>
    </div>
  </div>

  <!-- App Launcher Window -->
  <div class="runner-overlay" id="runnerOverlay">
    <div class="runner-window">
      <div class="runner-bar">
        <div class="runner-title">
          <span id="runnerAppName">التطبيق</span>
        </div>
        <div style="display:flex;gap:8px;">
          <a class="btn" id="runnerExternalLink" href="#" target="_blank" rel="noopener noreferrer">فتح في نافذة جديدة</a>
          <button class="btn btn-danger-soft" id="closeRunnerBtn">إغلاق</button>
        </div>
      </div>
      <iframe class="runner-frame" id="runnerFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase Realtime Database SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    /**
     * اختياري: ضع بيانات مشروع Firebase هنا لتفعيل المزامنة الحية مع Realtime Database.
     * إذا تُركت فارغة، سيعمل المتجر فوراً بالبيانات المحلية في المتصفح.
     */
    const FIREBASE_CONFIG = null;

    const STORAGE_KEYS = {
      downloads: "store_play_downloads_v1",
      library: "store_play_library_v1",
      ratings: "store_play_ratings_v1"
    };

    const DEMO_APPS = [
      {
        id: "app-notes",
        name: "مفكرة سريعة",

        version: "1.4.0",
        description: "تطبيق بسيط وسريع لكتابة الملاحظات اليومية وتنظيم الأفكار بواجهة نظيفة ومريحة للعين.",
        url: "about:blank",
        demoHtml: "<div style='font-family:system-ui;padding:24px;direction:rtl'><h2>مفكرة سريعة</h2><textarea style='width:100%;height:220px;padding:12px;font-size:16px;border-radius:12px;border:1px solid #ccc' placeholder='اكتب ملاحظتك هنا...'></textarea></div>",
        color: "#0b57d0",
        baseRating: 4.7,
        baseReviews: 18,
        baseDownloads: 1240,

      },
      {
        id: "app-calc",
        name: "آلة حاسبة ذكية",

        description: "آلة حاسبة يومية دقيقة وسريعة للعمليات الحسابية والنسب المئوية بدون تعقيد.",
        url: "about:blank",
        demoHtml: "<div style='font-family:system-ui;padding:24px;direction:rtl;max-width:340px;margin:auto'><h2>آلة حاسبة</h2><input id='a' type='number' placeholder='الرقم الأول' style='width:100%;padding:10px;margin-bottom:8px;font-size:16px'/><input id='b' type='number' placeholder='الرقم الثاني' style='width:100%;padding:10px;margin-bottom:8px;font-size:16px'/><button onclick='document.getElementById("res").innerText = "الناتج: " + (Number(document.getElementById("a").value||0) + Number(document.getElementById("b").value||0))' style='padding:10px 18px;font-size:15px;cursor:pointer'>جمع</button><p id='res' style='font-weight:bold;font-size:18px;margin-top:12px'>الناتج: 0</p></div>",

        color: "#b45309",
        baseRating: 4.8,
        baseReviews: 24,
        baseDownloads: 2150,
        screenshots: []
      },
      {
        id: "app-palette",
        name: "منسق الألوان",
        developer: "بصمة تصميم",
        version: "1.0.5",
        description: "أداة عملية لاختيار وتجربة درجات الألوان ومعاينة تناسقها بسرعة.",
        url: "about:blank",
        demoHtml: "<div style='font-family:system-ui;padding:24px;direction:rtl'><h2>منسق الألوان</h2><input type='color' value='#0b57d0' oninput='document.getElementById("box").style.background=this.value' style='width:80px;height:44px;cursor:pointer'/><div id='box' style='margin-top:16px;height:140px;border-radius:16px;background:#0b57d0'></div></div>",
        color: "#7c3aed",
        baseRating: 4.4,
        baseReviews: 9,
        baseDownloads: 640,
        screenshots: []
      },
      {
        id: "app-checklist",
        name: "قائمة الإنجاز",
        developer: "خطوات",
        version: "1.3.1",
        description: "قائمة مهام بسيطة لتسجيل ما تريد إنجازه اليوم وتحديد المكتمل بضغطة واحدة.",
        url: "about:blank",
        demoHtml: "<div style='font-family:system-ui;padding:24px;direction:rtl'><h2>قائمة الإنجاز</h2><label style='display:block;margin:10px 0;font-size:17px'><input type='checkbox'/> مراجعة المهام اليومية</label><label style='display:block;margin:10px 0;font-size:17px'><input type='checkbox'/> تحديث الملفات</label><label style='display:block;margin:10px 0;font-size:17px'><input type='checkbox'/> اختبار النسخة النهائية</label></div>",
        color: "#be123c",
        baseRating: 4.6,
        baseReviews: 15,
        baseDownloads: 1520,
        screenshots: []
      },
      {
        id: "app-unit",
        name: "محول الوحدات",
        developer: "أدوات اليوم",
        version: "1.1.0",
        description: "تحويل فوري بين وحدات الطول والوزن والسرعة بواجهة واضحة وسريعة.",
        url: "about:blank",
        demoHtml: "<div style='font-family:system-ui;padding:24px;direction:rtl'><h2>محول الوحدات (كيلومتر إلى متر)</h2><input id='km' type='number' placeholder='أدخل بالكيلومتر' oninput='document.getElementById("m").innerText = ((Number(this.value||0)*1000).toLocaleString()) + " متر"' style='width:100%;padding:10px;font-size:16px'/><p id='m' style='font-size:18px;font-weight:bold;margin-top:12px'>0 متر</p></div>",
        color: "#1d4ed8",
        baseRating: 4.3,
        baseReviews: 7,
        baseDownloads: 480,
        screenshots: []
      }
    ];

    let db = null;
    let currentUserId = "local-user";
    let apps = [...DEMO_APPS];
    let libraryMap = loadJson(STORAGE_KEYS.library, {});
    let downloadsMap = loadJson(STORAGE_KEYS.downloads, {});
    let ratingsMap = loadJson(STORAGE_KEYS.ratings, {});
    let activeAppId = null;
    let searchQuery = "";

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function saveJson(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (_) {}
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function getDownloadsCount(app) {
      if (typeof downloadsMap[app.id] === "number") {
        return Math.max(0, downloadsMap[app.id]);
      }
      return Math.max(0, app.baseDownloads || 0);
    }

    function setDownloadsCount(app, nextVal) {
      const safeVal = Math.max(0, Math.floor(nextVal));
      downloadsMap[app.id] = safeVal;
      saveJson(STORAGE_KEYS.downloads, downloadsMap);

      if (db) {
        db.ref(`appMetrics/${app.id}/downloads`).set(safeVal).catch(() => {});
      }
    }

    function isInLibrary(appId) {
      return Boolean(libraryMap[appId]);
    }

    /**
     * إضافة إلى المكتبة (+1 تنزيلات) أو إزالة من المكتبة (-1 تنزيلات دون النزول تحت 0).
     * فتح التطبيق لا يستدعي هذه الدالة ولا يغير عداد التنزيلات.
     */
    function toggleLibrary(appId) {
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      const currentlySaved = isInLibrary(appId);
      const currentDownloads = getDownloadsCount(app);

      if (!currentlySaved) {
        libraryMap[appId] = true;
        setDownloadsCount(app, currentDownloads + 1);
        if (db && currentUserId !== "local-user") {
          db.ref(`library/${currentUserId}/${appId}`).set(true).catch(() => {});
        }
        showToast("تمت الإضافة إلى المكتبة (+1 تنزيل)");
      } else {
        delete libraryMap[appId];
        setDownloadsCount(app, Math.max(0, currentDownloads - 1));
        if (db && currentUserId !== "local-user") {
          db.ref(`library/${currentUserId}/${appId}`).remove().catch(() => {});
        }
        showToast("تمت الإزالة من المكتبة (-1 تنزيل)");
      }

      saveJson(STORAGE_KEYS.library, libraryMap);
      updateLibraryBadge();
      renderCatalog();
      if (activeAppId === appId) {
        renderDetails(appId);
      }
      if (document.getElementById("libraryModal").classList.contains("open")) {
        renderLibraryModal();
      }
    }

    /**
     * فتح التطبيق فقط دون تعديل عداد التنزيلات.
     */
    function launchApp(appId) {
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      const overlay = document.getElementById("runnerOverlay");
      const frame = document.getElementById("runnerFrame");
      const titleEl = document.getElementById("runnerAppName");
      const extLink = document.getElementById("runnerExternalLink");

      titleEl.textContent = app.name;

      if (app.url && app.url !== "about:blank") {
        extLink.href = app.url;
        extLink.style.display = "inline-flex";
        frame.removeAttribute("srcdoc");
        frame.src = app.url;
      } else {
        extLink.style.display = "none";
        frame.removeAttribute("src");
        frame.srcdoc = app.demoHtml || `<div style="font-family:system-ui;padding:24px;direction:rtl"><h2>${escapeHtml(app.name)}</h2><p>التطبيق يعمل الآن.</p></div>`;
      }

      overlay.classList.add("open");
    }

    function closeRunner() {
      const overlay = document.getElementById("runnerOverlay");
      const frame = document.getElementById("runnerFrame");
      overlay.classList.remove("open");
      frame.src = "about:blank";
      frame.removeAttribute("srcdoc");
    }

    function getAppRatingSummary(app) {
      const customReviews = ratingsMap[app.id] || [];
      const baseTotal = (app.baseRating || 4.5) * (app.baseReviews || 1);
      const customTotal = customReviews.reduce((acc, r) => acc + Number(r.score || 0), 0);
      const count = (app.baseReviews || 0) + customReviews.length;
      const avg = count > 0 ? ((baseTotal + customTotal) / count) : (app.baseRating || 4.5);
      return {
        avg: avg.toFixed(1),
        count,
        reviews: customReviews
      };
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderIconElement(app, extraClass = "") {
      if (app.icon && typeof app.icon === "string" && app.icon.trim() !== "") {
        return `<img class="play-icon ${extraClass}" src="${escapeHtml(app.icon)}" alt="${escapeHtml(app.name)}" loading="lazy" />`;
      }
      const initial = escapeHtml((app.name || "ت").trim().charAt(0) || "ت");
      const bg = escapeHtml(app.color || "#0b57d0");
      return `<div class="play-icon-fallback ${extraClass}" style="background:${bg}">${initial}</div>`;
    }

    function renderPlayCard(app) {
      const ratingInfo = getAppRatingSummary(app);
      return `
        <article class="play-card" data-app-id="${escapeHtml(app.id)}" title="${escapeHtml(app.name)}">
          ${renderIconElement(app)}
          <div class="play-name">${escapeHtml(app.name)}</div>
          <div class="play-rating">
            <span>${ratingInfo.avg}</span>
            <span class="star">★</span>
          </div>
        </article>
      `;
    }

    function renderCatalog() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = q
        ? apps.filter(a => (a.name || "").toLowerCase().includes(q))
        : apps;

      const recommendedShelf = document.getElementById("recommendedShelf");
      const recommendedRow = document.getElementById("recommendedRow");
      const allAppsGrid = document.getElementById("allAppsGrid");
      const allAppsTitle = document.getElementById("allAppsTitle");

      if (q) {
        recommendedShelf.style.display = "none";
        allAppsTitle.textContent = `نتائج البحث (${filtered.length})`;
      } else {
        recommendedShelf.style.display = "block";
        allAppsTitle.textContent = "جميع التطبيقات";
        recommendedRow.innerHTML = apps.slice(0, 6).map(renderPlayCard).join("");
      }

      if (filtered.length === 0) {
        allAppsGrid.innerHTML = `<div class="empty-state">لا توجد تطبيقات مطابقة.</div>`;
      } else {
        allAppsGrid.innerHTML = filtered.map(renderPlayCard).join("");
      }
    }

    function openDetails(appId) {
      activeAppId = appId;
      document.getElementById("catalogView").style.display = "none";
      const detailsView = document.getElementById("detailsView");
      detailsView.classList.add("active");
      renderDetails(appId);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToCatalog() {
      activeAppId = null;
      document.getElementById("detailsView").classList.remove("active");
      document.getElementById("catalogView").style.display = "block";
    }

    function renderDetails(appId) {
      const app = apps.find(a => a.id === appId);
      const container = document.getElementById("detailsContent");
      if (!app) {
        container.innerHTML = `<div class="empty-state">التطبيق غير موجود.</div>`;
        return;
      }

      const saved = isInLibrary(app.id);
      const downloadsCount = getDownloadsCount(app);
      const ratingInfo = getAppRatingSummary(app);

      const screenshotsHtml = Array.isArray(app.screenshots) && app.screenshots.length > 0
        ? `
          <div class="section-block">
            <h2>لقطات الشاشة</h2>
            <div class="screenshots-row">
              ${app.screenshots.map(src => `<img src="${escapeHtml(src)}" alt="لقطة شاشة" loading="lazy" />`).join("")}
            </div>
          </div>
        `
        : "";

      const reviewsHtml = ratingInfo.reviews.length > 0
        ? ratingInfo.reviews.map(r => `
          <div class="review-card">
            <div class="review-top">
              <span>${escapeHtml(r.author || "مستخدم")}</span>
              <span>${escapeHtml(String(r.score))} ★</span>
            </div>
            <div>${escapeHtml(r.comment || "")}</div>
          </div>
        `).join("")
        : `<div class="empty-state">لا توجد تعليقات إضافية بعد. كن أول من يقيّم التطبيق.</div>`;

      container.innerHTML = `
        <div class="details-hero">
          <div class="details-icon-wrap">
            ${renderIconElement(app)}
          </div>
          <div class="details-meta">
            <h1>${escapeHtml(app.name)}</h1>
            <div class="details-sub">${escapeHtml(app.developer || "مطور مستقل")} ${app.version ? `• إصدار ${escapeHtml(app.version)}` : ""}</div>
          </div>
        </div>

        <div class="details-stats">
          <div class="stat-box">
            <div class="stat-value">${ratingInfo.avg} <span class="star">★</span></div>
            <div class="stat-label">${ratingInfo.count} تقييم</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="detailDownloadsValue">${downloadsCount.toLocaleString()}</div>
            <div class="stat-label">التنزيلات</div>
          </div>
        </div>

        <div class="details-actions">
          <button class="btn btn-primary" id="detailLaunchBtn">فتح التطبيق</button>
          <button class="btn ${saved ? "btn-danger-soft" : "btn-soft"}" id="detailLibraryBtn">
            ${saved ? "إزالة من المكتبة" : "إضافة إلى المكتبة"}
          </button>
        </div>

        <div class="section-block">
          <h2>حول هذا التطبيق</h2>
          <p style="margin:0;color:var(--text)">${escapeHtml(app.description || "لا يوجد وصف متاح.")}</p>
        </div>

        ${screenshotsHtml}

        <div class="section-block">
          <h2>التقييمات والمراجعات</h2>
          <form class="review-form" id="reviewForm">
            <input type="text" id="reviewAuthor" placeholder="اسمك (اختياري)" maxlength="60" />
            <select id="reviewScore" required>
              <option value="5">5 نجوم ★ ★ ★ ★ ★</option>
              <option value="4">4 نجوم ★ ★ ★ ★</option>
              <option value="3">3 نجوم ★ ★ ★</option>
              <option value="2">2 نجوم ★ ★</option>
              <option value="1">نجمة واحدة ★</option>
            </select>
            <textarea id="reviewComment" rows="3" placeholder="اكتب رأيك في التطبيق..." maxlength="600"></textarea>
            <button class="btn btn-primary" type="submit" style="align-self:flex-start">إرسال التقييم</button>
          </form>
          <div style="margin-top:16px">${reviewsHtml}</div>
        </div>
      `;

      document.getElementById("detailLaunchBtn").addEventListener("click", () => launchApp(app.id));
      document.getElementById("detailLibraryBtn").addEventListener("click", () => toggleLibrary(app.id));

      document.getElementById("reviewForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const author = document.getElementById("reviewAuthor").value.trim() || "مستخدم";
        const score = Number(document.getElementById("reviewScore").value || 5);
        const comment = document.getElementById("reviewComment").value.trim();

        const list = ratingsMap[app.id] || [];
        list.unshift({ author, score, comment, createdAt: Date.now() });
        ratingsMap[app.id] = list;
        saveJson(STORAGE_KEYS.ratings, ratingsMap);

        showToast("تم حفظ تقييمك");
        renderCatalog();
        renderDetails(app.id);
      });
    }

    function updateLibraryBadge() {
      const count = Object.keys(libraryMap).filter(id => libraryMap[id]).length;
      document.getElementById("libraryCountBadge").textContent = String(count);
    }

    function renderLibraryModal() {
      const listEl = document.getElementById("libraryList");
      const savedApps = apps.filter(a => isInLibrary(a.id));

      if (savedApps.length === 0) {
        listEl.innerHTML = `<div class="empty-state">مكتبتك فارغة حالياً. أضف تطبيقاً من المتجر ليظهر هنا.</div>`;
        return;
      }

      listEl.innerHTML = savedApps.map(app => `
        <div class="lib-item">
          <div class="lib-item-left" data-open-detail="${escapeHtml(app.id)}">
            ${renderIconElement(app)}
            <div>
              <div style="font-weight:700;font-size:14px">${escapeHtml(app.name)}</div>
              <div style="font-size:12px;color:var(--muted)">${getDownloadsCount(app).toLocaleString()} تنزيل</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-primary" data-launch-app="${escapeHtml(app.id)}">فتح</button>
            <button class="btn btn-danger-soft" data-remove-lib="${escapeHtml(app.id)}">إزالة</button>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-open-detail]").forEach(el => {
        el.addEventListener("click", () => {
          document.getElementById("libraryModal").classList.remove("open");
          openDetails(el.getAttribute("data-open-detail"));
        });
      });

      listEl.querySelectorAll("[data-launch-app]").forEach(el => {
        el.addEventListener("click", () => {
          document.getElementById("libraryModal").classList.remove("open");
          launchApp(el.getAttribute("data-launch-app"));
        });
      });

      listEl.querySelectorAll("[data-remove-lib]").forEach(el => {
        el.addEventListener("click", () => toggleLibrary(el.getAttribute("data-remove-lib")));
      });
    }

    function initFirebaseIfConfigured() {
      if (!FIREBASE_CONFIG || typeof firebase === "undefined") return;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.database();

        firebase.auth().onAuthStateChanged(user => {
          currentUserId = user ? user.uid : "local-user";
          if (user) {
            db.ref(`library/${user.uid}`).once("value").then(snap => {
              const val = snap.val();
              if (val && typeof val === "object") {
                libraryMap = { ...libraryMap, ...val };
                saveJson(STORAGE_KEYS.library, libraryMap);
                updateLibraryBadge();
              }
            }).catch(() => {});
          }
        });

        db.ref("catalog").on("value", snap => {
          const val = snap.val();
          if (val && typeof val === "object") {
            const remoteApps = Object.entries(val).map(([id, item]) => ({
              id,
              ...item
            }));
            if (remoteApps.length > 0) {
              apps = remoteApps;
              renderCatalog();
              if (activeAppId) renderDetails(activeAppId);
            }
          }
        });

        db.ref("appMetrics").on("value", snap => {
          const val = snap.val();
          if (val && typeof val === "object") {
            Object.entries(val).forEach(([appId, metrics]) => {
              if (metrics && typeof metrics.downloads === "number") {
                downloadsMap[appId] = Math.max(0, metrics.downloads);
              }
            });
            saveJson(STORAGE_KEYS.downloads, downloadsMap);
            if (activeAppId) renderDetails(activeAppId);
          }
        });
      } catch (_) {
        db = null;
      }
    }

    // Event Listeners
    document.addEventListener("click", (e) => {
      const card = e.target.closest(".play-card");
      if (card && card.dataset.appId) {
        openDetails(card.dataset.appId);
      }
    });

    document.getElementById("homeBrand").addEventListener("click", backToCatalog);
    document.getElementById("backToStoreBtn").addEventListener("click", backToCatalog);

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value || "";
      if (activeAppId) backToCatalog();
      renderCatalog();
    });

    document.getElementById("openLibraryBtn").addEventListener("click", () => {
      renderLibraryModal();
      document.getElementById("libraryModal").classList.add("open");
    });

    document.getElementById("closeLibraryBtn").addEventListener("click", () => {
      document.getElementById("libraryModal").classList.remove("open");
    });

    document.getElementById("libraryModal").addEventListener("click", (e) => {
      if (e.target.id === "libraryModal") {
        e.currentTarget.classList.remove("open");
      }
    });

    document.getElementById("closeRunnerBtn").addEventListener("click", closeRunner);
    document.getElementById("runnerOverlay").addEventListener("click", (e) => {
      if (e.target.id === "runnerOverlay") closeRunner();
    });

    // Initial Boot
    updateLibraryBadge();
    renderCatalog();
    initFirebaseIfConfigured();
  </script>
</body>
</html>
