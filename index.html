async function ensureProfile(u){
 const pending=ensureProfile.pending||(ensureProfile.pending=new Map());
 if(pending.has(u.uid))return pending.get(u.uid);
 const job=(async()=>{
  let stage='read';
  try{
   const f=await firebase();const existing=await read('users/'+u.uid);if(existing)return existing;
   stage='create';
   await f.runTransaction(f.ref(f.db,'users/'+u.uid),value=>value===null?{name:(u.displayName||u.email.split('@')[0]).slice(0,70).padEnd(2,' '),email:u.email,photo:'',role:'user',banned:false,createdAt:f.serverTimestamp()}:undefined);
   stage='read';const profile=await read('users/'+u.uid);if(!profile)throw Error('profile_missing');return profile;
  }catch(e){e.profileStep=stage;e.userMessage=S.lang==='ar'?'تم قبول بيانات الدخول، لكن تعذر فتح الحساب. حاول مجددًا أو تواصل مع إدارة المتجر.':'Your sign-in was accepted, but the account could not be opened. Retry or contact the store administrator.';throw e;}
 })();
 pending.set(u.uid,job);try{return await job;}finally{if(pending.get(u.uid)===job)pending.delete(u.uid);}
}

async function compress(file,size=192){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error(S.lang==='ar'?'اختر صورة PNG أو JPEG أو WebP.':'Choose PNG, JPEG or WebP.');if(file.size>5*1024*1024)throw Error('5 MB maximum');const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);const scale=Math.min(size/bitmap.width,size/bitmap.height),w=bitmap.width*scale,h=bitmap.height*scale;ctx.drawImage(bitmap,(size-w)/2,(size-h)/2,w,h);bitmap.close();const data=canvas.toDataURL('image/jpeg',.82);if(data.length>95000)throw Error(S.lang==='ar'?'الصورة كبيرة. جرّب صورة أبسط.':'Image too large. Try a smaller image.');return data;}

 const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${t(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td>${t('emptyAdmin')}</td></tr>`}</tbody></table></div>`;
 $('#main').innerHTML=`${heading('admin','adminSub',`<button id="refreshAdmin">${t('refresh')}</button>`)}<div class="stats">${[[S.apps.length,'approved'],[apps.filter(a=>a.status==='blocked').length,'blocked'],[accounts.length,'users'],[issues.filter(r=>r.status==='open').length,'reports']].map(([n,label])=>`<div class="stat"><b>${n}</b><span>${t(label)}</span></div>`).join('')}</div><details open class="panel"><summary>${t('apps')} (${apps.length})</summary>${table(['details','status','action'],apps.slice(0,500).map(a=>`<tr><td><div class="app-top"><img src="${image(a.icon)}" class="app-icon" alt=""><div><b>${esc(a.name)}</b><br><small>${esc(users?.[a.owner]?.name||a.owner)}</small></div></div><p>${esc(a.description)}</p><a href="${esc(url(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.url)}</a></td><td><span class="badge ${esc(a.status)}">${t(a.status)}</span></td><td><div class="actions">${btn('app',a.id,'approve',a.owner,'approved')}${btn('app',a.id,'reject',a.owner,'rejected')}${btn('delete',a.id,'deleteApp',a.owner)}</div></td></tr>`))}</details><details class="panel" open><summary>${t('updates')} (${requests.length})</summary>${table(['appName','newURL','status','action'],requests.slice(0,500).map(r=>`<tr><td>${esc(allApps?.[r.owner]?.[r.appId]?.name||r.appId)}</td><td><a href="${esc(url(r.url))}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a></td><td>${t(r.status)}</td><td><div class="actions">${r.status==='pending'?btn('update',r.id,'approve',r.owner,'approved')+btn('update',r.id,'reject',r.owner,'rejected'):''}</div></td></tr>`))}</details><details class="panel"><summary>${t('users')} (${accounts.length})</summary>${table(['name','email','role','action'],accounts.slice(0,500).map(u=>`<tr><td>${esc(u.name)} ${u.banned?'⛔':''}<br><code>${esc(u.id)}</code></td><td>${esc(u.email)}</td><td>${t(u.id===S.adminUid?'admin':u.role)}</td><td><div class="actions">${u.id===S.adminUid?'—':btn('ban',u.id,u.banned?'unban':'ban','',u.banned?'false':'true')+btn('role',u.id,'developerChange','',u.role==='developer'?'user':'developer')}</div></td></tr>`))}</details><details class="panel"><summary>${t('reports')} (${issues.length})</summary>${table(['appName','reason','status','action'],issues.slice(0,500).map(r=>`<tr><td>${esc(apps.find(a=>a.id===r.appId)?.name||r.appId)}</td><td>${esc(r.reason)}</td><td>${t(r.status==='open'?'reports':'resolved')}</td><td>${r.status==='open'?btn('report',r.id,'resolve',r.owner):''}</td></tr>`))}</details><details class="panel"><summary>${t('audit')}</summary>${table(['action','details','status'],list(audit).sort((a,b)=>b.createdAt-a.createdAt).slice(0,200).map(a=>`<tr><td>${esc(a.action)}</td><td><code>${esc(a.target)}</code></td><td>${esc(new Date(a.createdAt).toLocaleString(S.lang))}</td></tr>`))}</details><details class="panel"><summary>${t('storeSettings')}</summary><form id="storeSettings">${field('name','storeName','text',`value="${esc(settings?.name||'Web Store')}" minlength="2" maxlength="70"`)}<label>${t('tagline')}<input name="tagline" value="${esc(settings?.tagline||'')}" maxlength="200"></label><p class="form-error" role="alert"></p><button type="submit" class="primary">${t('submit')}</button></form></details><p class="muted">${S.lang==='ar'?'تُعرض أحدث 500 نتيجة للقسم، و200 إجراء.':'Latest 500 records per section, 200 audit entries.'}</p>`;
 $('#main').insertAdjacentHTML('beforeend',`<div class="panel"><h2>${t('announce')}</h2><form id="announceForm">${field('title','noticeTitle','text','maxlength="80"')}<label>${t('noticeBody')}<textarea name="body" maxlength="600" required></textarea></label><p class="form-error" role="alert"></p><button class="primary" type="submit">${t('sendNotice')}</button></form></div>`);form('#announceForm',async(b,f)=>{const id=key('announcements');await patch(logChange({['announcements/'+id]:{title:b.title.trim(),body:b.body.trim(),createdAt:FB.serverTimestamp()}},'announcement',id));f.reset();toast(t('done'));});
$('#refreshAdmin').onclick=route;form('#storeSettings',async b=>{await patch(logChange({settings:{name:b.name.trim(),tagline:b.tagline.trim()}},'store_settings','settings'));toast(t('done'));});
 document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=async()=>{if(!confirm(t('confirm')))return;b.disabled=true;try{const kind=b.dataset.kind,id=b.dataset.id,owner=b.dataset.owner,value=b.dataset.value;let changes={};
  if(kind==='delete'){changes['appOwners/'+id]=owner;changes['catalog/'+id]=null;changes['developerApps/'+owner+'/'+id+'/status']='blocked';changes['developerApps/'+owner+'/'+id+'/reviewNote']=S.lang==='ar'?'حُذف من المتجر بواسطة الإدارة':'Removed by administrator';Object.assign(changes,noticeChanges(owner,id,S.lang==='ar'?'إزالة تطبيق':'App removed',allApps?.[owner]?.[id]?.name||id));}
  if(kind==='app'){const a=await read('developerApps/'+owner+'/'+id);if(!a)throw Error('App not found');if(value==='approved'&&users?.[owner]?.banned)throw Error(t('banned'));changes['developerApps/'+owner+'/'+id+'/status']=value;if(value==='approved'){const {status,reviewNote,...pub}=a;changes['catalog/'+id]={...pub,owner,developer:users?.[owner]?.name||'Developer'};}else changes['catalog/'+id]=null;}
  if(kind==='ban'){Object.assign(changes,noticeChanges(id,'account',value==='true'?t('ban'):t('unban'),S.lang==='ar'?'تم تحديث حالة حسابك بواسطة الإدارة.':'Your account status was updated by the administrator.'));const banned=value==='true';changes['users/'+id+'/banned']=banned;if(banned){for(const a of apps.filter(a=>a.owner===id)){changes['appOwners/'+a.id]=id;changes['catalog/'+a.id]=null;changes['developerApps/'+id+'/'+a.id+'/status']='blocked';}}}
  if(kind==='role')changes['users/'+id+'/role']=value;
  if(kind==='update'){const r=await read('appUpdates/'+owner+'/'+id);if(!r||r.status!=='pending')throw Error('Request already reviewed');changes['appUpdates/'+owner+'/'+id+'/status']=value;if(value==='approved'){const a=await read('developerApps/'+owner+'/'+r.appId);if(!a||a.status!=='approved'||users?.[owner]?.banned)throw Error('App must be published and developer active');changes['developerApps/'+owner+'/'+r.appId+'/url']=r.url;changes['catalog/'+r.appId+'/url']=r.url;}}
  if(kind==='report')changes['reports/'+owner+'/'+id+'/status']='resolved';await patch(logChange(changes,kind+'_'+(value||'resolved'),id));toast(t('done'));route();
 }catch(e){toast(errorMessage(e));b.disabled=false;}});
}

function navigate(page){
 const allowed=['store','library','developer','myapps','profile','about','admin'];
 if(!allowed.includes(page)&&!/^app\/[-A-Za-z0-9_]+$/.test(page))return;
 const hash='#'+page;
 if(location.hash!==hash)history.pushState(null,'',hash);
 close();return route(page);
}
document.addEventListener('click',event=>{
 const link=event.target.closest?.('a[href^="#"]');if(!link)return;
 const page=link.getAttribute('href').slice(1);
 if(!['store','library','developer','myapps','profile','about','admin'].includes(page))return;
 event.preventDefault();navigate(page);
});
window.addEventListener('popstate',()=>route());

let routeVersion=0;
async function route(target){const version=++routeVersion,page=typeof target==='string'?target:(location.hash.slice(1)||'store');document.body.classList.remove('viewing-app');shell();document.body.classList.remove('menu-open');$('#overlay').hidden=true;$('#menu').setAttribute('aria-expanded','false');document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===page));$('#main').innerHTML=`<div class="loading" role="status">${t('loading')}</div>`;
 try{if(/^app\/[-A-Za-z0-9_]+$/.test(page)){const id=page.slice(4);const found=S.apps.find(a=>a.id===id);const data=found||await read('catalog/'+id);if(version!==routeVersion)return;if(!data)throw Error(t('appUnavailable'));renderViewer({...data,id});return;}if(page==='store'){renderStore();return;}if(page==='about'){aboutPage();return;}
  if(!S.configured){$('#main').innerHTML=empty('needLogin','setup','store');setupDialog();return;}
  if(!S.user){$('#main').innerHTML=`${empty('needLogin','needLoginSub')}<div class="actions"><button id="needLogin" class="primary">${t('login')}</button><button id="needRegister">${t('register')}</button></div>`;$('#needLogin').onclick=()=>authDialog();$('#needRegister').onclick=()=>authDialog('register');return;}
  if(S.user.banned){$('#main').innerHTML=`<div class="empty"><h3>${t('banned')}</h3><button id="bannedLogout">${t('logout')}</button></div>`;$('#bannedLogout').onclick=()=>FB.signOut(FB.auth);return;}
  if(page==='profile'){profilePage();return;}
  if(page==='developer'){publishPage();return;}
  if(page==='myapps'){await myAppsPage(version);return;}
  if(page==='library'){const lib=await read('library/'+S.user.id);if(version!==routeVersion)return;const apps=S.apps.filter(a=>lib?.[a.id]);$('#main').innerHTML=heading('library','librarySub')+(apps.length?cards(apps,{library:true}):empty('emptyLibrary','emptyLibrarySub'));bindCards(apps);return;}
  if(page==='admin'){if(!S.user.isAdmin)throw Error(t('permission'));await adminPage(version);return;}
  location.hash='store';
 }catch(e){if(version!==routeVersion)return;$('#main').innerHTML=`<div class="empty"><h3>${esc(errorMessage(e))}</h3><button id="retry">${t('retry')}</button></div>`;$('#retry').onclick=route;}
}
$('#closeDialog').onclick=close;$('#dialog').addEventListener('close',()=>$('#dialog iframe')?.remove());$('#accountBtn').onclick=()=>S.user?navigate('profile'):authDialog();$('#lang').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';localStorage.setItem('ah13-lang',S.lang);close();route();};$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('ah13-theme',S.theme);shell();};$('#menu').onclick=()=>{const open=document.body.classList.toggle('menu-open');$('#overlay').hidden=!open;$('#menu').setAttribute('aria-expanded',String(open));};$('#overlay').onclick=()=>{document.body.classList.remove('menu-open');$('#overlay').hidden=true;$('#menu').setAttribute('aria-expanded','false');};$('#globalSearch').oninput=e=>{S.query=e.target.value;if((location.hash||'#store')!=='#store')navigate('store');else filterApps();};window.addEventListener('hashchange',()=>{close();route();});for(const event of ['online','offline'])window.addEventListener(event,shell);
let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false;});$('#install').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;$('#install').hidden=true;}};
async function init(){shell();renderStore();try{const config=await(await fetch('./firebase-config.json',{cache:'no-store'})).json();if(['localhost','127.0.0.1'].includes(location.hostname)&&new URLSearchParams(location.search).get('emulator')==='1')Object.assign(config,{apiKey:'fake-api-key',authDomain:'demo-ah13-store.firebaseapp.com',projectId:'demo-ah13-store',databaseURL:'https://demo-ah13-store.firebaseio.com',appId:'demo'});S.config=config;S.configured=!!config.apiKey&&!JSON.stringify(config).includes('YOUR_');if(!S.configured)return;const f=await firebase();listenNotices();f.onAuthStateChanged(f.auth,async u=>{try{await loadAccount(u);route();}catch(e){toast(errorMessage(e));}});f.onValue(f.ref(f.db,'catalog'),snap=>{S.apps=list(snap.val()).sort((a,b)=>b.createdAt-a.createdAt).slice(0,500);const page=location.hash.slice(1)||'store';if(page==='store')renderStore();if(page==='library'&&S.user)route();},e=>{toast(S.lang==='ar'?'تعذر تحميل التطبيقات. أعد المحاولة لاحقًا.':'Apps could not be loaded. Please retry later.');});f.onValue(f.ref(f.db,'ratings'),snap=>{S.ratings=snap.val()||{};if($('#appGrid'))filterApps();},e=>toast(errorMessage(e)));f.onValue(f.ref(f.db,'settings'),snap=>{const settings=snap.val();if(settings){document.querySelector('.brand b').textContent=settings.name;document.querySelector('.brand small').textContent=settings.tagline||t('space');}},()=>{});route();}catch(e){toast(errorMessage(e));renderStore();}finally{if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}}
init();
paths.bell='M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4';
S.announcements={};S.notices={};
function noticeChanges(uid,appId,title,body){return {['notifications/'+uid+'/'+key('notifications/'+uid)]:{title:title.slice(0,80),body:body.slice(0,600),type:'system',appId,read:false,createdAt:FB.serverTimestamp()}};}
async function ownNotice(appId,title,body){try{await write('notifications/'+S.user.id+'/'+key('notifications/'+S.user.id),{title:title.slice(0,80),body:body.slice(0,600),type:'published',appId,read:false,createdAt:FB.serverTimestamp()});}catch{toast(S.lang==='ar'?'تم حفظ التطبيق، لكن تعذر حفظ الإشعار.':'App saved; notification could not be saved.');}}
async function adminNotice(uid,appId,title,body){await patch(noticeChanges(uid,appId,title,body));}
function allNotices(){return [...list(S.announcements).map(n=>({...n,public:true})),...list(S.notices).map(n=>({...n,public:false}))].sort((a,b)=>b.createdAt-a.createdAt);}
function refreshBell(){const mark=Number(localStorage.getItem('webstore-notice-read-'+(S.user?.id||'guest'))||0);const count=allNotices().filter(n=>n.public?n.createdAt>mark:!n.read).length;$('#bellCount').textContent=count>99?'99+':count;$('#bellCount').hidden=count===0;}
function listenNotices(){FB.onValue(FB.ref(FB.db,'announcements'),snapshot=>{S.announcements=snapshot.val()||{};refreshBell();},e=>toast(errorMessage(e)));}
function listenOwnNotices(){if(S.noticeUnsub)S.noticeUnsub();S.noticeUnsub=FB.onValue(FB.ref(FB.db,'notifications/'+S.user.id),snapshot=>{S.notices=snapshot.val()||{};refreshBell();},e=>toast(errorMessage(e)));}
function noticesDialog(){const notices=allNotices();modal(`<h2>${t('notifications')}</h2>${notices.length?`<div class="actions"><button id="markNotices">${t('markRead')}</button></div>${notices.slice(0,100).map(n=>`<article class="review"><div class="notice-title"><i>${icon(n.public?'spark':'bell')}</i><b>${esc(n.title)}</b>${!n.public&&!n.read?'<span class="badge">●</span>':''}</div><p>${esc(n.body)}</p><small class="muted">${esc(new Date(n.createdAt).toLocaleString(S.lang))}</small></article>`).join('')}`:`<div class="empty">${icon('bell')}<p>${t('noNotices')}</p></div>`}`);if($('#markNotices'))$('#markNotices').onclick=async()=>{try{const changes={};if(S.user)for(const n of list(S.notices))if(!n.read)changes['notifications/'+S.user.id+'/'+n.id+'/read']=true;if(Object.keys(changes).length)await patch(changes);localStorage.setItem('webstore-notice-read-'+(S.user?.id||'guest'),String(Date.now()));refreshBell();noticesDialog();toast(t('done'));}catch(e){toast(errorMessage(e));}};}
$('#bell').onclick=noticesDialog;
</script></body></html>
